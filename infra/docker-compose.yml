version: '3.8'

services:
  # ==========================================
  # Orchestration & Data
  # ==========================================
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - content-engine-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    networks:
      - content-engine-net

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - content-engine-net

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - content-engine-net
  # ==========================================
  # Intelligence Layer (Hybrid AI)
  # ==========================================
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - content-engine-net

  llm-local:
    build:
      context: ../services/llm_local
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "8008:8000"
    depends_on:
      - ollama
    networks:
      - content-engine-net
  # ==========================================
  # Logic Services (Brain, Content, Art, Policy)
  # ==========================================
  brain:
    build:
      context: ..
      dockerfile: services/brain/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - ollama
    volumes:
      - ../output:/app/output
    deploy:
      resources:
        limits:
          cpus: '0.75' # Target ~75% of a core per container instance (or multiply by workers)
          # Note: Parallel execution dictates total usage more than this limit.
          # Leaving generous to allow burst, but script limits concurrency to 3.
    networks:
      - content-engine-net

  render:
    build:
      context: ..
      dockerfile: services/render/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ../.env
    volumes:
      - ../output:/app/output
      - ../assets:/app/assets
    deploy:
      resources:
        limits:
          cpus: '1.50' # Render needs more power. 
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - content-engine-net

networks:
  content-engine-net:
    driver: bridge
