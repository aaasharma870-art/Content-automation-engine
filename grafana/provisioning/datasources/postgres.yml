apiVersion: 1

datasources:
  - name: AI Brain Postgres
    uid: aibrain-pg
    type: postgres
    access: proxy
    url: postgres:5432
    database: aibrain
    user: ${DB_USER:-aibrain}
    secureJsonData:
      password: ${DB_PASSWORD:-changeme}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    isDefault: true
    editable: true
